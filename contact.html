  <main>
    <h1>Contact Us</h1>

    <!-- simple contact form -->
    <form action="#" method="post">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send</button>
    </form>

    <!-- brief requires the contact page to show more than one location -->
    <section class="locations">
      <h2>Our Locations</h2>
      <!-- placeholder: replace with an embedded google map (iframe) once addresses are finalised -->

      <ul>
        <li>Alexandra Centre &mdash; <!-- placeholder address --></li>
        <li>Diepsloot Centre &mdash; <!-- placeholder address --></li>
      </ul>
    </section>
