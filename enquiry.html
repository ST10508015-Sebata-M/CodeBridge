<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeBridge | Apply / Volunteer / Sponsor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo">CodeBridge</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="programmes.html">Programmes</a></li>
        <li><a href="enquiry.html">Apply / Volunteer</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Apply / Volunteer / Sponsor</h1>
    <p>Select the enquiry type that applies to you and complete the form below.</p>

    <!-- single form covering all three npo enquiry types, per part 1 brief section 4.1
         (learner application / volunteer sign-up / sponsor enquiry) -->
    <form action="#" method="post">

      <!-- enquiry type: full validation logic (required select) added in part 3 -->
      <label for="enquiry-type">Enquiry type</label>
      <select id="enquiry-type" name="enquiry-type" required>
        <option value="">-- please choose --</option>
        <option value="learner">Learner Application</option>
        <option value="volunteer">Volunteer Sign-up</option>
        <option value="sponsor">Sponsor Enquiry</option>
      </select>

      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" name="full-name" required>

      <label for="contact-number">Contact Number</label>
      <input type="tel" id="contact-number" name="contact-number" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <!-- fields below only relevant for a learner application; shown/hidden dynamically via js in part 3 -->
      <label for="centre">Preferred Centre</label>
      <select id="centre" name="centre">
        <option value="">-- please choose --</option>
        <option value="alexandra">Alexandra Centre</option>
        <option value="diepsloot">Diepsloot Centre</option>
      </select>

      <label for="programme">Programme of Interest</label>
      <select id="programme" name="programme">
        <option value="">-- please choose --</option>
        <option value="web-dev">Intro to Web Development</option>
        <option value="js-fundamentals">JavaScript Fundamentals</option>
        <option value="digital-literacy">Digital Literacy Basics</option>
      </select>

      <label for="motivation">Short Motivation</label>
      <textarea id="motivation" name="motivation" rows="4"></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 CodeBridge NPO. All rights reserved.</p>
    <ul>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="#"><!-- social link placeholder --></a></li>
      <li><a href="#">Donate</a></li>
    </ul>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
